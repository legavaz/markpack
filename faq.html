<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Помощь — Марк Пак</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="faq">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="page-head"><h1>Помощь</h1></div>

      <div class="detail" style="grid-template-columns:minmax(0,1fr) 360px">
        <div class="card">
          <h3 class="mb-12">Ответы на частые вопросы</h3>
          <div id="faqList"></div>
        </div>

        <aside class="card">
          <h3 class="mb-12">Видео инструкции</h3>
          <p class="hint mb-16">В разделе «Помощь» на основном сайте мы собрали подробные видео-инструкции: как пользоваться сервисом, как сдать вещи на склад и получить их обратно, как привязать карту.</p>
          <a class="btn btn--ghost btn--block" href="https://markpack.ru" target="_blank" rel="noreferrer">Открыть раздел на сайте →</a>
        </aside>
      </div>
    </main>
  </div>
</div>
<nav class="bottom-nav" id="bottomNav"></nav>

<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script>
(() => {
  const list = document.getElementById('faqList');
  list.innerHTML = window.DB.faq.map((f, i) => `
    <div class="faq-item ${i === 0 ? 'is-open' : ''}">
      <button class="faq-q">${UI.esc(f.q)}
        <svg viewBox="0 0 20 20" fill="none"><path d="m5 7.5 5 5 5-5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="faq-a">${UI.esc(f.a)}</div>
    </div>`).join('');

  list.querySelectorAll('.faq-q').forEach(q => q.addEventListener('click', () => {
    q.closest('.faq-item').classList.toggle('is-open');
  }));
})();
</script>
</body>
</html>
