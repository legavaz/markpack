<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Мои заказы — Марк Пак</title>
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body data-page="orders">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content">
      <div class="page-head"><h1>Мои заказы</h1></div>

      <div class="tabs" id="tabs">
        <button class="tab is-active" data-tab="active">Активные</button>
        <button class="tab" data-tab="archive">Архив</button>
      </div>

      <div id="list" class="order-list"></div>
    </main>
  </div>
</div>
<nav class="bottom-nav" id="bottomNav"></nav>

<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script>
(() => {
  const DB = window.DB;
  const list = document.getElementById('list');
  const ACTIVE = ['CREATED', 'PROCESSING', 'CONFIRMED', 'PACKED', 'DELIVERY', 'ACCEPTED'];

  function render(tab) {
    document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('is-active', b.dataset.tab === tab));
    const items = DB.orders.filter(o => tab === 'active' ? ACTIVE.includes(o.status) : !ACTIVE.includes(o.status));
    if (!items.length) {
      list.innerHTML = `<div class="empty">
        <h3>${tab === 'active' ? 'Активных заказов нет' : 'В архиве пока пусто'}</h3>
        <p>${tab === 'active' ? 'Создайте заявку на сдачу или возврат вещей.' : 'Здесь появятся завершённые и отменённые заказы.'}</p>
        ${tab === 'active' ? '<a class="btn btn--primary mt-16" href="send.html" style="display:inline-flex">Сдать вещи</a>' : ''}
      </div>`;
      return;
    }
    list.innerHTML = items.map(o => UI.orderRow(o)).join('');
  }

  document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => render(b.dataset.tab)));
  render('active');
})();
</script>
</body>
</html>
